name: ci

on:
  push:
  pull_request:
    # edited: check the title and body again after they change
    types: [opened, synchronize, reopened, edited]

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Labels, attribution and key material
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            RANGE="origin/main..${{ github.sha }}"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi
          scripts/check-repo.sh "$RANGE"
      - name: Hygiene check self-test
        run: scripts/test-check-repo.sh
      - name: Pull request title and body
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > "$RUNNER_TEMP/pull-request.md"
          scripts/check-repo.sh --text "$RUNNER_TEMP/pull-request.md"

  guard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guard
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: guard
      - name: Native tests
        run: cargo test --lib --test guard_tests
      - name: Deployable wasm build
        run: cargo build --target wasm32-wasip2 --release
      - name: Manifest is embedded
        run: grep -q -a 'outlayer.manifest' target/wasm32-wasip2/release/guard.wasm

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - name: Build the client library
        working-directory: client
        run: npm ci && npm run build
      - name: Install
        working-directory: server
        run: npm ci
      - name: Typecheck
        working-directory: server
        run: npm run typecheck
      - name: Test
        working-directory: server
        run: npm test

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            agent/package-lock.json
      - name: Build the client library
        working-directory: client
        run: npm ci && npm run build
      - name: Install
        working-directory: agent
        run: npm ci
      - name: Typecheck
        working-directory: agent
        run: npm run typecheck
      - name: Test
        working-directory: agent
        run: npm test
      - name: Build the MCP server
        working-directory: agent
        run: npm run build

  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract
          cache-bin: true
      - name: Install cargo-near
        run: cargo near --version || cargo install cargo-near --locked --no-default-features
      - name: Unit and sandbox tests
        run: cargo test

  signer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signer
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: signer
          cache-bin: true
      - name: Install cargo-near
        run: cargo near --version || cargo install cargo-near --locked --no-default-features
      - name: Unit tests
        run: cargo test
      - name: Build and keep the contract small
        run: |
          cargo near build non-reproducible-wasm --no-abi
          size=$(stat -c %s target/near/unhuntable_signer.wasm)
          echo "unhuntable_signer.wasm: $size bytes"
          test "$size" -le 100000

  exit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            exit/package-lock.json
      - name: Install the client library
        working-directory: client
        run: npm ci
      - name: Install the build tools
        working-directory: exit
        run: npm ci
      - name: Rebuild the exit page and check the committed bundle matches
        working-directory: exit
        run: |
          npm run build
          git diff --exit-code -- exit.js

  web:
    # Chromium's system packages come from apt; ubuntu-24.04 keeps that install reliable
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            web/package-lock.json
      - name: Build the client library
        working-directory: client
        run: npm ci && npm run build
      - name: Install
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Unit tests
        working-directory: web
        run: npm test
      - name: Static export
        working-directory: web
        run: npm run build
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser tests at 360 and 1280 wide
        working-directory: web
        run: npx playwright test
      - name: Keep the phone screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-screenshots
          path: web/screenshots/
          if-no-files-found: ignore
