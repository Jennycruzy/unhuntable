[package]
name = "guard"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "guard"
path = "src/main.rs"

[lib]
name = "guardlib"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
sha3 = { version = "0.10", default-features = false }
rmp = "0.8"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic"] }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
outlayer = { version = "0.2.1", features = ["signing-keys", "encryption-keys"] }
wasi = "0.13"


[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
